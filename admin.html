<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin & Lucky Draw - Kempen Hentikan Stigma</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- ADMIN AUTH MODAL -->
  <div id="authOverlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-xs w-full shadow-2xl text-center space-y-4">
      <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div>
        <h2 class="text-base font-bold text-white">Akses Admin</h2>
        <p class="text-xs text-slate-400 mt-1">Sila masukkan PIN keselamatan untuk memuat turun data.</p>
      </div>
      <input type="password" id="pinInput" class="w-full text-center tracking-widest text-lg font-mono py-2 bg-slate-800 border border-slate-700 rounded-xl text-white outline-none focus:border-indigo-500" placeholder="••••••••">
      <button id="btnAuth" onclick="verifyPin()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-2.5 rounded-xl font-semibold text-xs tracking-wide transition flex items-center justify-center gap-2">
        Buka Panel
      </button>
    </div>
  </div>

  <!-- MAIN ADMIN DASHBOARD -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md p-4 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        <h1 class="font-bold text-sm text-white">Panel Cabutan Bertuah (Lucky Draw)</h1>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-slate-400" id="totalParticipantsBadge">0 Peserta</span>
        <button onclick="openRecoveryModal()" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded-lg border border-indigo-500 flex items-center gap-1.5 transition text-white shadow-sm">
          <i class="fa-solid fa-life-ring"></i> Pemulihan Profil
        </button>
        <button id="btnRefresh" onclick="loadParticipants(true)" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-rotate text-[10px]"></i> Muat Semula
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 flex-1 flex flex-col md:flex-row items-center justify-center gap-8 w-full">
    
    <!-- WHEEL DISPLAY -->
    <div class="flex flex-col items-center justify-center relative">
      <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-20 text-amber-400 text-2xl drop-shadow-md">
        <i class="fa-solid fa-location-pin"></i>
      </div>
      <canvas id="wheelCanvas" width="380" height="380" class="rounded-full shadow-2xl border-4 border-slate-800 bg-slate-950"></canvas>
      <button id="btnSpin" onclick="spinWheel()" class="mt-6 px-8 py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-extrabold rounded-full shadow-lg transition transform active:scale-95 text-sm uppercase tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-play"></i> Putar Roda
      </button>
    </div>

    <!-- WINNER & HISTORY BOARD -->
    <div class="w-full md:w-80 bg-slate-950/60 border border-slate-800/80 rounded-2xl p-4 flex flex-col h-[380px]">
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
        <i class="fa-solid fa-trophy text-amber-400"></i> Pemenang Terpilih
      </h3>
      <div id="winnersList" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
        <p class="text-slate-600 italic text-center my-auto">Belum ada pemenang diputar.</p>
      </div>
    </div>
  </main>

  <!-- RECOVERY MODAL -->
  <div id="recoveryModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 p-5 rounded-2xl max-w-md w-full shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-white"><i class="fa-solid fa-magnifying-glass text-indigo-400 mr-2"></i>Cari & Pulih Profil</h2>
        <button onclick="closeRecoveryModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="text" id="searchInput" onkeyup="searchParticipant()" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white text-sm focus:border-indigo-500 outline-none mb-3" placeholder="Taip nama peserta...">
      <div id="searchResults" class="flex-1 overflow-y-auto space-y-2 mb-3 pr-1"></div>
      <div id="recoveryQrContainer" class="hidden flex-col items-center justify-center p-6 bg-slate-800 rounded-xl border border-slate-700">
        <p class="text-xs text-slate-300 mb-2">Minta peserta imbas kod QR ini:</p>
        <p class="text-sm font-bold text-amber-400 mb-4 text-center" id="recoveryQrName"></p>
        <div id="recoveryQrcode" class="bg-white p-2.5 rounded-xl shadow-lg"></div>
        <button onclick="hideRecoveryQr()" class="mt-5 text-xs text-slate-400 hover:text-white underline">Kembali ke carian</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby5JysOKW16jVmcAzkQUAbrEjX9zJON0uCzdMCns95jEyeQn9dXVAFA-I_wtU5G2DurnQ/exec";
    
    let adminPin = "";
    let allParticipants = []; 
    let wheelParticipants = []; 
    let winnersHistory = [];
    
    let startAngle = 0, arc = 0, spinTimeout = null, spinAngleStart = 10, spinTime = 0, spinTimeTotal = 0, ctx;
    const colors = ["#4f46e5", "#0ea5e9", "#10b981", "#f59e0b", "#ec4899", "#8b5cf6", "#06b6d4", "#84cc16"];

    function verifyPin() {
      adminPin = document.getElementById("pinInput").value.trim();
      if (!adminPin) return;
      const btn = document.getElementById("btnAuth");
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-sm"></i> Menyemak PIN...';
      btn.classList.replace("bg-indigo-600", "bg-indigo-400");
      btn.classList.add("cursor-wait");
      loadParticipants();
    }

    async function loadParticipants(isRefresh = false) {
      let refreshBtn;
      if (isRefresh) {
        refreshBtn = document.getElementById("btnRefresh");
        refreshBtn.disabled = true;
        refreshBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-[10px]"></i> Menyemak...';
      }

      try {
        const res = await fetch(`${GAS_URL}?action=admin_fetch&pin=${encodeURIComponent(adminPin)}`);
        const data = await res.json();

        if (data.status === "error") {
          alert("PIN Keselamatan Tidak Sah!");
          if (!isRefresh) resetAuthButton();
          return;
        }

        document.getElementById("authOverlay").classList.add("hidden");
        
        allParticipants = data.participants || [];
        const rawAttendance = data.attendance || [];
        const rawWinners = data.winners || [];
        
        const todayStr = new Date().toDateString();
        const todayAttendeeIds = rawAttendance
          .filter(a => new Date(a.time).toDateString() === todayStr)
          .map(a => a.id);
          
        const winnerIds = rawWinners.map(w => w.id);
        
        wheelParticipants = allParticipants.filter(p => todayAttendeeIds.includes(p.id) && !winnerIds.includes(p.id));
        
        winnersHistory = rawWinners.map(w => {
          const profile = allParticipants.find(p => p.id === w.id);
          return { id: w.id, name: profile ? profile.name : "Unknown", address: profile ? profile.address : "", claimed: true };
        }).reverse(); 

        document.getElementById("totalParticipantsBadge").innerText = `${wheelParticipants.length} Hadir & Layak`;

        if (wheelParticipants.length > 0) drawRouletteWheel();
        else drawEmptyWheel("Semua Pemenang / Tiada Kehadiran");
        
        renderWinnersList();
        
      } catch (e) {
        alert("Gagal menyambung ke pangkalan data.");
        if (!isRefresh) resetAuthButton();
      } finally {
        if (isRefresh) {
          refreshBtn.disabled = false;
          refreshBtn.innerHTML = '<i class="fa-solid fa-rotate text-[10px]"></i> Muat Semula';
        }
      }
    }

    function resetAuthButton() {
      const btn = document.getElementById("btnAuth");
      btn.disabled = false;
      btn.innerHTML = 'Buka Panel';
      btn.classList.remove("bg-indigo-400", "cursor-wait");
      btn.classList.add("bg-indigo-600");
    }

    function drawEmptyWheel(text) {
      const canvas = document.getElementById("wheelCanvas");
      ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, 380, 380);
      ctx.fillStyle = "#1e293b"; ctx.beginPath(); ctx.arc(190, 190, 180, 0, 2 * Math.PI); ctx.fill();
      ctx.fillStyle = "#94a3b8"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center"; ctx.fillText(text, 190, 195);
    }

    function drawRouletteWheel() {
      const canvas = document.getElementById("wheelCanvas");
      if (!canvas.getContext) return;
      ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, 380, 380);

      const outsideRadius = 180, textRadius = 115, insideRadius = 40;
      arc = Math.PI * 2 / wheelParticipants.length;

      for (let i = 0; i < wheelParticipants.length; i++) {
        const angle = startAngle + i * arc;
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath(); ctx.arc(190, 190, outsideRadius, angle, angle + arc, false); ctx.arc(190, 190, insideRadius, angle + arc, angle, true); ctx.fill();

        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.translate(190 + Math.cos(angle + arc / 2) * textRadius, 190 + Math.sin(angle + arc / 2) * textRadius);
        ctx.rotate(angle + arc / 2 + Math.PI);
        
        const p = wheelParticipants[i];
        const dispName = p.name.length > 15 ? p.name.substring(0, 13) + "…" : p.name;
        const dispAddr = p.address.length > 15 ? p.address.substring(0, 13) + "…" : p.address;

        ctx.font = "bold 11px sans-serif"; ctx.fillText(dispName, -ctx.measureText(dispName).width / 2, -4);
        ctx.font = "normal 9px sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillText(dispAddr, -ctx.measureText(dispAddr).width / 2, 8);
        ctx.restore();
      }
      ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(190, 190, insideRadius - 5, 0, Math.PI * 2, true); ctx.fill();
    }

    function spinWheel() {
      if (wheelParticipants.length === 0) return;
      document.getElementById("btnSpin").disabled = true;
      spinAngleStart = Math.random() * 10 + 10;
      spinTime = 0;
      spinTimeTotal = Math.random() * 3000 + 4000;
      rotateWheel();
    }

    function rotateWheel() {
      spinTime += 30;
      if (spinTime >= spinTimeTotal) { stopRotateWheel(); return; }
      startAngle += ((spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal)) * Math.PI / 180);
      drawRouletteWheel();
      spinTimeout = requestAnimationFrame(rotateWheel);
    }

    function stopRotateWheel() {
      cancelAnimationFrame(spinTimeout);
      const degrees = startAngle * 180 / Math.PI + 90;
      const index = Math.floor((360 - degrees % 360) / (arc * 180 / Math.PI)) % wheelParticipants.length;
      announceWinner(wheelParticipants[index], index);
      document.getElementById("btnSpin").disabled = false;
    }

    function announceWinner(winner, index) {
      confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });

      fetch(GAS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "submit_winner", userId: winner.id }) });

      wheelParticipants.splice(index, 1);
      document.getElementById("totalParticipantsBadge").innerText = `${wheelParticipants.length} Hadir & Layak`;
      
      if (wheelParticipants.length > 0) drawRouletteWheel();
      else drawEmptyWheel("Semua Telah Menang!");

      winnersHistory.unshift({ id: winner.id, name: winner.name, address: winner.address, claimed: false });
      renderWinnersList();
    }

    function renderWinnersList() {
      const list = document.getElementById("winnersList");
      if (winnersHistory.length === 0) { list.innerHTML = '<p class="text-slate-600 italic text-center my-auto">Belum ada pemenang diputar.</p>'; return; }

      list.innerHTML = winnersHistory.map((w, i) => {
        let cardClass = "p-3 border rounded-xl flex items-center justify-between cursor-pointer transition-all duration-300 transform hover:scale-[1.02] ";
        let textClass = "font-bold text-xs ";
        let iconHtml = "";

        if (w.claimed) {
          cardClass += "bg-emerald-950/40 border-emerald-800 opacity-60"; textClass += "text-emerald-500 line-through"; iconHtml = '<i class="fa-solid fa-circle-check text-emerald-500 text-lg"></i>';
        } else if (i === 0) {
          cardClass += "bg-slate-900 border-amber-400 shadow-[0_0_15px_rgba(251,191,36,0.15)]"; textClass += "text-amber-300 text-[13px]"; iconHtml = '<i class="fa-solid fa-award text-amber-400 text-2xl animate-pulse"></i>';
        } else {
          cardClass += "bg-slate-900 border-slate-700 hover:border-slate-500"; textClass += "text-slate-300"; iconHtml = '<i class="fa-solid fa-gift text-slate-500 text-base"></i>';
        }
        return `
          <div onclick="toggleClaim(${i})" class="${cardClass}" title="Klik untuk tanda/buang tanda">
            <div>
              <p class="${textClass}">${w.name}</p>
              <p class="text-[10px] text-slate-500 mt-0.5"><span class="font-mono">${w.id}</span> • ${w.address}</p>
            </div>
            ${iconHtml}
          </div>
        `;
      }).join('');
    }

    function toggleClaim(index) { winnersHistory[index].claimed = !winnersHistory[index].claimed; renderWinnersList(); }
    function easeOut(t, b, c, d) { const ts = (t /= d) * t, tc = ts * t; return b + c * (tc + -3 * ts + 3 * t); }

    // --- RECOVERY LOGIC ---
    function openRecoveryModal() {
      if(allParticipants.length === 0) { alert("Sila buka panel dahulu."); return; }
      document.getElementById('recoveryModal').classList.replace('hidden', 'flex');
      document.getElementById('searchInput').value = ''; document.getElementById('searchResults').innerHTML = ''; hideRecoveryQr();
    }
    function closeRecoveryModal() { document.getElementById('recoveryModal').classList.replace('flex', 'hidden'); }

    function searchParticipant() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const resultsContainer = document.getElementById('searchResults');
      if (query.length < 2) { resultsContainer.innerHTML = ''; return; }
      
      const matches = allParticipants.filter(p => p.name.toLowerCase().includes(query));
      if (matches.length === 0) { resultsContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-4 italic">Tiada rekod dijumpai.</p>'; return; }

      resultsContainer.innerHTML = matches.map(p => `
        <div class="flex items-center justify-between p-3 bg-slate-800/60 border border-slate-700 rounded-xl hover:border-indigo-500 transition">
          <div class="flex-1 pr-2">
            <p class="text-xs font-bold text-white">${p.name}</p>
            <p class="text-[10px] text-slate-400 font-mono mt-0.5">${p.id} • ${p.role.toUpperCase()}</p>
            
            <!-- Lencana Status Tinjauan -->
            <div class="flex flex-wrap gap-1.5 mt-2">
              <span class="text-[9px] px-1.5 py-0.5 rounded border ${p.stigDone ? 'bg-emerald-900/40 text-emerald-400 border-emerald-800' : 'bg-slate-800 text-slate-500 border-slate-700'}">
                <i class="fa-solid ${p.stigDone ? 'fa-check' : 'fa-xmark'}"></i> STIG-9
              </span>
              <span class="text-[9px] px-1.5 py-0.5 rounded border ${p.kebDone ? 'bg-emerald-900/40 text-emerald-400 border-emerald-800' : 'bg-slate-800 text-slate-500 border-slate-700'}">
                <i class="fa-solid ${p.kebDone ? 'fa-check' : 'fa-xmark'}"></i> Penilaian
              </span>
            </div>
          </div>
          
          <button onclick="generateRecoveryQr('${p.id}', '${encodeURIComponent(p.name)}', '${p.role}')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg shadow-md flex items-center gap-1 shrink-0">
            <i class="fa-solid fa-qrcode"></i> Jana
          </button>
        </div>
      `).join('');
    }

    function generateRecoveryQr(id, encodedName, role) {
      document.getElementById('searchResults').classList.add('hidden'); document.getElementById('searchInput').classList.add('hidden');
      const qrWrap = document.getElementById('recoveryQrContainer'); qrWrap.classList.replace('hidden', 'flex');
      document.getElementById('recoveryQrName').innerText = decodeURIComponent(encodedName);
      const qrDiv = document.getElementById('recoveryQrcode'); qrDiv.innerHTML = ''; 
      new QRCode(qrDiv, { text: `${window.location.href.split('admin.html')[0]}?importId=${id}&importName=${encodedName}&importRole=${role}`, width: 170, height: 170 });
    }
    
    function hideRecoveryQr() {
      document.getElementById('recoveryQrContainer').classList.replace('flex', 'hidden');
      document.getElementById('searchResults').classList.remove('hidden'); document.getElementById('searchInput').classList.remove('hidden');
    }
  </script>
</body>
</html>
